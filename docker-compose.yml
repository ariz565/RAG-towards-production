# Vision — local container stack.
#   docker compose up --build              # API only (embedded Qdrant on disk)
#   docker compose --profile server up     # API + standalone Qdrant server
services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # persist indexes, bm25, qdrant, audit, users
    restart: unless-stopped

  # Optional: run Qdrant as a server instead of the embedded on-disk client.
  # Enable with `--profile server` and set QDRANT_USE_SERVER=true, QDRANT_HOST=qdrant.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["server"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
